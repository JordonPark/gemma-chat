# Android 릴리스 APK 빌드 → (1) Actions Artifact, (2) GitHub Release "android-latest" 에 첨부
#
# 받는 사람은 GitHub 로그인 없이 아래 링크로 바로 받을 수 있다:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/MyBuddyOffline.apk
#
# 서명: Expo 템플릿 기본값(디버그 키스토어)으로 서명된 "사내 배포/테스트용" APK.
#       Play 스토어에 올리려면 별도 업로드 키로 서명한 AAB 가 필요하다.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'index.ts'
      - 'src/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-fast-${{ github.ref }}
  cancel-in-progress: false  # 이미 진행 중인 APK 배포를 완료한 뒤 다음 빌드를 시작한다.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      # 저장소 Settings › Variables 의 EXPO_PROJECT_ID(+ 팀 계정이면 EXPO_OWNER)가 있으면
      # OTA 업데이트가 켜진 앱을 빌드한다. 값을 바꾼 뒤에는 앱을 새로 빌드·설치해야 반영된다.
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # llama.rn 은 CPU 종류별 JNI 래퍼를 7개 컴파일한다. 실제로 쓰이는 4개만 남긴다.
      # (뺀 v8 / v8_2 / v8_2_i8mm 기기는 기본 rnllama_jni 로 동작)
      RNLLAMA_VARIANTS: rnllama,rnllama_v8_2_dotprod,rnllama_v8_2_dotprod_i8mm,rnllama_v8_2_dotprod_i8mm_hexagon_opencl
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·빌드 결과 캐시 (2번째 빌드부터 크게 빨라짐)
      - uses: gradle/actions/setup-gradle@v6

      # C++ 컴파일 캐시 (llama.rn JSI 래퍼, React Native 네이티브 코드)
      - uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: android-arm64
          max-size: 2G

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        # 로그를 실시간으로 보여 준다 (Actions 페이지에서 진행 상황 확인 가능)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain --parallel --build-cache \
            -PrnllamaVariants="$RNLLAMA_VARIANTS" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            2>&1 | tee ../gradle.log
          ccache -s || true

      - name: Report build errors
        if: failure()
        run: |
          # 오류를 Actions 주석으로 남겨서 실행 페이지에서 바로 보이게 한다
          { grep -E "error:|e: |What went wrong" -A2 gradle.log 2>/dev/null || true; } | grep -v "^--$" | head -10 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
          tail -80 gradle.log 2>/dev/null || true

      - name: Package APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MyBuddyOffline.apk
          ls -lh dist/MyBuddyOffline.apk
          sha256sum dist/MyBuddyOffline.apk | tee dist/MyBuddyOffline.apk.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: MyBuddyOffline-apk
          path: dist/
          retention-days: 30

      - name: Publish to GitHub Release (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          TITLE="My Buddy Offline Android (latest)"
          NOTES="My Buddy Offline Android APK (최신 main 빌드: ${GITHUB_SHA::7})

          설치: 휴대폰에서 MyBuddyOffline.apk를 받아 열고, '출처를 알 수 없는 앱 설치'를 허용하세요.
          첫 실행 시 모델을 고르고 다운로드 용량을 확인한 뒤 다운로드를 시작하세요."
          # 기존 다운로드 링크에서도 같은 APK를 제공한다.
          cp dist/MyBuddyOffline.apk dist/GemmaChat.apk
          sha256sum dist/GemmaChat.apk > dist/GemmaChat.apk.sha256
          assets=(dist/MyBuddyOffline.apk dist/MyBuddyOffline.apk.sha256 dist/GemmaChat.apk dist/GemmaChat.apk.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${assets[@]}" --title "$TITLE" --notes "$NOTES" --prerelease
          fi

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
