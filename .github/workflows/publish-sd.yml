# iPhone 이미지 생성용 Stable Diffusion 1.5 (Apple Core ML, 6-bit palettized, Neural Engine 용 split_einsum_v2)
# 를 Hugging Face 에서 받아 GitHub Release(model-v1)에 sd.json 과 함께 올린다. 앱은 그림 기능을 처음 쓸 때 받는다.
# 라이선스: CreativeML OpenRAIL-M (모델 카드의 사용 제한을 따른다). NOTICE 를 함께 올린다.
name: Publish image model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sd.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_REPO: apple/coreml-stable-diffusion-v1-5-palettized
      HF_FILE: coreml-stable-diffusion-v1-5-palettized_split_einsum_v2_compiled.zip
      ASSET: sd15-palettized-split-einsum-v2.zip
      TAG: model-v1
    steps:
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p dist
          curl -sSfL -H "Authorization: Bearer $HF_TOKEN" -o "dist/$ASSET" \
            "https://huggingface.co/$HF_REPO/resolve/main/$HF_FILE"
          ls -l dist
          # 압축 안 구성 확인 (앱이 리소스 폴더를 찾을 때 참고)
          LIST=$(unzip -l "dist/$ASSET" | awk 'NR>3 && $4 !~ /\/$/ && $4 != "" {print $4}' | grep -v "^__MACOSX" | grep -vE "/(weights|model)\.(bin|mil)$|/analytics/|/model\.mil$|metadata\.json$|coremldata\.bin$" | head -40 | tr '\n' ' ')
          echo "::notice title=zip contents::$LIST"
          TOP=$(unzip -l "dist/$ASSET" | awk 'NR>3 {print $4}' | grep -E "\.mlmodelc/$" | head -12 | tr '\n' ' ')
          echo "::notice title=mlmodelc dirs::$TOP"

      - name: Manifest + notice
        run: |
          SIZE=$(stat -c %s "dist/$ASSET")
          SHA=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          printf '{\n  "format": 1,\n  "name": "%s",\n  "size": %s,\n  "sha256": "%s",\n  "model": "stable-diffusion-v1-5 (Core ML, 6-bit palettized, split_einsum_v2)",\n  "license": "CreativeML OpenRAIL-M"\n}\n' "$ASSET" "$SIZE" "$SHA" > dist/sd.json
          cat > dist/NOTICE-SD.txt <<'TXT'
          Stable Diffusion v1.5 converted to Core ML by Apple (huggingface.co/apple/coreml-stable-diffusion-v1-5-palettized).
          License: CreativeML OpenRAIL-M. Use of the model must follow the license's use-based restrictions
          (https://huggingface.co/spaces/CompVis/stable-diffusion-license).
          TXT
          cat dist/sd.json
          echo "::notice title=sd.json::$(tr -d '\n' < dist/sd.json)"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
