# iPhone 그림 모델 배포: SD 1.5 기반 일러스트·애니 특화 모델 (Core ML, Neural Engine 용 split_einsum)
#   - 모델: Counterfeit-V3.0 (coreml-community 변환본, CreativeML OpenRAIL-M)
#   - 이 변환본에는 안전 검사(SafetyChecker)가 없어서, Apple SD 1.5 패키지의 SafetyChecker.mlmodelc 를 함께 넣는다
#   - 이 앱은 그림→그림 변환을 쓰지 않으므로 VAEEncoder 는 뺀다
# 결과를 Release(model-v1)에 올리고 sd.json 을 새 모델로 바꾼다 (이전 sd.json 은 sd-<이전 id>.json 으로 보관).
name: Publish image model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sd.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODEL_ID: counterfeit-v3
      MODEL_DESC: Counterfeit-V3.0 (SD 1.5 anime/illustration fine-tune, Core ML split_einsum, fp16)
      HF_REPO: coreml-community/coreml-Counterfeit
      HF_FILE: split-einsum/Counterfeit-V3.0_split-einsum.zip
      ASSET: counterfeit-v3-split-einsum.zip
      SAFETY_SRC: sd15-palettized-split-einsum-v2.zip
      TAG: model-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p work && cd work
          curl -sSfL -H "Authorization: Bearer $HF_TOKEN" -o model.zip "https://huggingface.co/$HF_REPO/resolve/main/$HF_FILE"
          unzip -q model.zip -d m && rm model.zip
          # macOS 가 zip 에 넣는 __MACOSX(리소스 포크) 폴더는 모델이 아니다. 지우고 시작한다
          find m -name '__MACOSX' -type d -prune -exec rm -rf {} +
          find m -name '._*' -type f -delete
          RES=$(dirname "$(find m -type d -name 'Unet.mlmodelc' -not -path '*/__MACOSX/*' | head -1)")
          [ -n "$RES" ] && [ "$RES" != "." ] || { echo "::error::Unet.mlmodelc 를 찾지 못했습니다"; find m -maxdepth 3 | head -40; exit 1; }
          echo "RES=$PWD/$RES" >> "$GITHUB_ENV"
          echo "::notice title=model contents::$(ls "$RES" | tr '\n' ' ')"

      - name: Add Apple SafetyChecker and tokenizer, drop VAEEncoder
        run: |
          cd work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SAFETY_SRC" --pattern sd.json
          # 안전 검사 + SD 1.5 공통 CLIP 토크나이저(vocab.json, merges.txt; 변환본에 빠져 있음)를 Apple 패키지에서 가져온다
          unzip -q "$SAFETY_SRC" '*SafetyChecker.mlmodelc/*' '*vocab.json' '*merges.txt' -d safety && rm "$SAFETY_SRC"
          SC=$(find safety -type d -name 'SafetyChecker.mlmodelc' -not -path '*/__MACOSX/*' | head -1)
          [ -n "$SC" ] || { echo "::error::SafetyChecker 를 찾지 못했습니다"; exit 1; }
          rm -rf "$RES/SafetyChecker.mlmodelc" "$RES/VAEEncoder.mlmodelc"
          cp -R "$SC" "$RES/"
          for t in vocab.json merges.txt; do
            [ -e "$RES/$t" ] || cp "$(find safety -name "$t" -not -path '*/__MACOSX/*' | head -1)" "$RES/"
          done
          for f in TextEncoder.mlmodelc Unet.mlmodelc VAEDecoder.mlmodelc SafetyChecker.mlmodelc vocab.json merges.txt; do
            [ -e "$RES/$f" ] || { echo "::error::$f 가 없습니다"; exit 1; }
          done
          # 안전장치: Unet 가중치가 너무 작으면(예: 엉뚱한 폴더) 올리지 않는다
          UNET=$(du -sm "$RES/Unet.mlmodelc" | cut -f1)
          [ "$UNET" -gt 800 ] || { echo "::error::Unet.mlmodelc 가 ${UNET}MB 로 너무 작습니다 (잘못된 패키지)"; exit 1; }
          echo "::notice title=resources::$(du -sh "$RES"/* | tr '\n' ' ')"

      - name: Zip + manifest
        run: |
          cd work
          OLD_ID=$(python3 -c "import json;print(json.load(open('sd.json')).get('id','sd15'))")
          cp sd.json "sd-$OLD_ID.json"
          mkdir -p ../dist
          (cd "$(dirname "$RES")" && zip -q -r -0 "$GITHUB_WORKSPACE/dist/$ASSET" "$(basename "$RES")")
          SIZE=$(stat -c %s "../dist/$ASSET"); SHA=$(sha256sum "../dist/$ASSET" | cut -d' ' -f1)
          python3 - <<PY
          import json
          json.dump({"format": 1, "id": "$MODEL_ID", "name": "$ASSET", "size": $SIZE, "sha256": "$SHA",
                     "model": "$MODEL_DESC", "license": "CreativeML OpenRAIL-M"}, open("../dist/sd.json", "w"), indent=2)
          PY
          cp "sd-$OLD_ID.json" ../dist/
          cat > ../dist/NOTICE-SD.txt <<'TXT'
          Image model: Counterfeit-V3.0 (Stable Diffusion 1.5 fine-tune by gsdf), Core ML conversion by coreml-community
          (huggingface.co/coreml-community/coreml-Counterfeit). Safety checker from Apple's Core ML Stable Diffusion v1.5.
          License: CreativeML OpenRAIL-M. Use must follow the license's use-based restrictions
          (https://huggingface.co/spaces/CompVis/stable-diffusion-license).
          TXT
          ls -l ../dist
          echo "::notice title=sd.json::$(tr -d '\n' < ../dist/sd.json)"

      - name: Upload to GitHub Release
        run: |
          # 모델 zip 을 먼저 올리고 sd.json 은 마지막에 바꾼다
          gh release upload "$TAG" "dist/$ASSET" dist/NOTICE-SD.txt dist/sd-*.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/sd.json --clobber --repo "$GITHUB_REPOSITORY"
