# 일회성 조사: Core ML 로 변환된 SD 1.5 기반 일러스트·애니 모델 후보 (이름·라이선스·파일·크기)
name: Explore SD models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/explore-sd-models.yml'

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Search candidates
        run: |
          cat > s.py <<'PY'
          import json, os, re, urllib.request
          H = {"Authorization": "Bearer " + os.environ["HF_TOKEN"]}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60))
          KW = re.compile(r"anime|illust|counterfeit|dreamshaper|rev.?anim|meina|anything|toon|cartoon|ghibli|disney|pixar|waifu|cetus|aniverse|niji|kawaii|chibi|storybook|comic|manga|flat|vector|3d", re.I)
          rows = []
          for q in ["https://huggingface.co/api/models?author=coreml-community&limit=500&full=true",
                    "https://huggingface.co/api/models?search=coreml&limit=300&full=true"]:
              try:
                  for m in get(q):
                      mid = m["id"]
                      if not KW.search(mid): continue
                      lic = (m.get("cardData") or {}).get("license") or next((t[8:] for t in m.get("tags", []) if t.startswith("license:")), "?")
                      rows.append((m.get("downloads", 0), mid, lic, m.get("lastModified", "")[:10]))
              except Exception as e:
                  print("::warning::search failed", q, e)
          for mid in ["coreml-community/coreml-dreamshaper-4-and-5", "coreml-community/coreml-ReV-Animated", "coreml-community/coreml-Counterfeit",
                      "coreml-community/coreml-meinamix_meinaV10", "coreml-community/cormel-DreamShaper-v8_cn", "coreml-community/coreml-DreamShaper-v5.0_cn",
                      "coreml-community/coreml-toonYou-beta5pruned_cn", "coreml-community/coreml-realMoonAnime-v70_cn", "coreml-community/coreml-anything-v5_cn"]:
              try:
                  files = get(f"https://huggingface.co/api/models/{mid}/tree/main?recursive=true")
                  zs = [f"{x['path']}({round(x.get('size',0)/1e6)}MB)" for x in files if x.get("type") == "file" and x["path"].endswith(".zip") and "split" in x["path"].lower()]
                  card = urllib.request.urlopen(urllib.request.Request(f"https://huggingface.co/{mid}/raw/main/README.md", headers=H), timeout=60).read().decode("utf-8", "ignore")
                  base = re.findall(r"(?i)(based on [^\n]{0,80}|stable diffusion v?[12][.0-9]*|sd ?1\.5|safety[^\n]{0,60}|6-?bit|8-?bit|palett[^\n]{0,40}|fp16|float16)", card)[:6]
                  print(f"::notice title={mid}::split_zips={zs} card_hints={base}")
              except Exception as e:
                  print(f"::warning::{mid} failed {e}")
          PY
          python3 s.py
