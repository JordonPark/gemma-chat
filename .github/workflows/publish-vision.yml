# Gemma 3 4B 의 비전 프로젝터(mmproj, 약 0.85GB)를 Hugging Face git 에서 받아
# GitHub Release(model-v1)에 vision.json 과 함께 올린다. 앱은 사진 기능을 처음 쓸 때 이걸 받는다.
# (HF_TOKEN 시크릿은 Publish model 과 같은 것을 쓴다)
name: Publish vision model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vision.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_REPO: google/gemma-3-4b-it-qat-q4_0-gguf
      TAG: model-v1
    steps:
      - name: Check HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::HF_TOKEN 시크릿이 없습니다."; exit 1; }

      - name: Download mmproj from Hugging Face (git + LFS)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 "https://user:${HF_TOKEN}@huggingface.co/${HF_REPO}" model-src
          ls -la model-src
          git -C model-src lfs pull --include "mmproj*"
          F=$(ls model-src/mmproj*.gguf | head -1)
          [ -n "$F" ] || { echo "::error::mmproj*.gguf 파일을 찾지 못했습니다"; exit 1; }
          head -c 4 "$F" | grep -q GGUF || { echo "::error::$F 가 GGUF 가 아닙니다 (LFS 포인터?)"; exit 1; }
          mkdir -p dist
          cp "$F" dist/
          NAME=$(basename "$F")
          SIZE=$(stat -c %s "dist/$NAME")
          SHA=$(sha256sum "dist/$NAME" | cut -d' ' -f1)
          printf '{\n  "format": 1,\n  "name": "%s",\n  "size": %s,\n  "sha256": "%s"\n}\n' "$NAME" "$SIZE" "$SHA" > dist/vision.json
          python3 tools/package_model_licenses.py gemma dist
          cat dist/vision.json

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::Release $TAG 이 없습니다. Publish model 을 먼저 실행하세요."; exit 1; }
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
