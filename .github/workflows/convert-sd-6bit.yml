# 그림 모델 용량 줄이기: Counterfeit-V3.0 원본 가중치 → Core ML(split_einsum_v2) + 6bit 팔레트 압축 → iPhone 용 패키지
#   1) convert (Linux, 메모리 16GB): diffusers 형식으로 바꾼 뒤 Apple torch2coreml 로 변환·6bit 압축 (.mlpackage)
#      안전 검사(SafetyChecker)도 직접 변환해 6bit 로 줄인다 (Apple fp16 본은 0.58GB)
#   2) package (macOS): Neural Engine 용으로 컴파일(.mlmodelc), 토크나이저 추가, Release 에 올리고 sd.json 교체
# 결과 크기 목표 ≈ 1.0~1.1GB (fp16 변환본 2.5GB)
name: Convert image model to 6-bit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-sd-6bit.yml'

permissions:
  contents: write

env:
  SRC_REPO: gsdf/Counterfeit-V3.0
  MODEL_ID: counterfeit-v3-6bit-sc6
  MODEL_DESC: Counterfeit-V3.0 (SD 1.5 anime/illustration fine-tune, Core ML split_einsum_v2, 6-bit palettized incl. safety checker)
  ASSET: counterfeit-v3-6bit-sc6-split-einsum-v2.zip
  ML_SD_COMMIT: ea2805d
  TAG: model-v1

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install converter (Apple ml-stable-diffusion)
        run: |
          git clone https://github.com/apple/ml-stable-diffusion mlsd && git -C mlsd checkout -q "$ML_SD_COMMIT"
          # SD3 용 diffusionkit 은 macOS 전용이라 Linux 에서는 없이 돌린다 (SD 1.5 변환에는 쓰지 않음)
          python3 - <<'PY'
          p = 'mlsd/python_coreml_stable_diffusion/torch2coreml.py'
          s = open(p).read()
          s = s.replace("""from diffusionkit.tests.torch2coreml import (
              convert_mmdit_to_mlpackage,
              convert_vae_to_mlpackage
          )""", """try:
              from diffusionkit.tests.torch2coreml import (
                  convert_mmdit_to_mlpackage,
                  convert_vae_to_mlpackage
              )
          except ImportError:
              convert_mmdit_to_mlpackage = convert_vae_to_mlpackage = None""")
          s = s.replace("    from diffusionkit.version import __version__\n", "    try:\n        from diffusionkit.version import __version__\n    except ImportError:\n        __version__ = 'n/a'\n")
          assert 'except ImportError:\n    convert_mmdit_to_mlpackage' in s, 'patch 1 failed'
          open(p, 'w').write(s)
          PY
          pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet coremltools==8.3.0 "diffusers[torch]==0.30.2" transformers==4.44.2 huggingface-hub==0.24.6 \
            "numpy<1.24" scipy scikit-learn safetensors accelerate omegaconf pytest matplotlib invisible-watermark requests
          pip install --quiet --no-deps -e mlsd
          python3 -c "import coremltools, torch, diffusers; print(coremltools.__version__, torch.__version__, diffusers.__version__)"
          python3 -c "import python_coreml_stable_diffusion.torch2coreml" 2> imp.log || { echo "::error title=import::$(tail -15 imp.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Download source weights and build diffusers folder
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          from huggingface_hub import list_repo_files, hf_hub_download, snapshot_download
          repo = os.environ['SRC_REPO']; tok = os.environ['HF_TOKEN']
          files = list_repo_files(repo, token=tok)
          print('::notice title=source files::' + ' | '.join(files[:40]))
          import torch
          from diffusers import StableDiffusionPipeline
          if 'model_index.json' in files:
              path = snapshot_download(repo, token=tok, allow_patterns=['*.json', '*.txt', '*.safetensors', '*/*.json', '*/*.txt', '*/*.safetensors'])
              pipe = StableDiffusionPipeline.from_pretrained(path, safety_checker=None, torch_dtype=torch.float32)
          else:
              cands = [f for f in files if f.endswith('.safetensors')]
              pick = sorted(cands, key=lambda f: (('fp16' not in f.lower()), ('3.0' not in f), len(f)))[0]
              print(f'::notice title=picked::{pick}')
              ck = hf_hub_download(repo, pick, token=tok)
              pipe = StableDiffusionPipeline.from_single_file(
                  ck, config='stable-diffusion-v1-5/stable-diffusion-v1-5', load_safety_checker=False, torch_dtype=torch.float32)
          # 안전 검사기(부적절한 그림 걸러내기)를 같이 넣어 변환 대상에 포함시킨다
          from diffusers.pipelines.stable_diffusion.safety_checker import StableDiffusionSafetyChecker
          from transformers import CLIPImageProcessor
          sc = StableDiffusionSafetyChecker.from_pretrained('CompVis/stable-diffusion-safety-checker', torch_dtype=torch.float32)
          fe = CLIPImageProcessor.from_pretrained('openai/clip-vit-base-patch32')
          comps = {k: v for k, v in pipe.components.items() if k not in ('safety_checker', 'feature_extractor')}
          pipe = StableDiffusionPipeline(**comps, safety_checker=sc, feature_extractor=fe, requires_safety_checker=True)
          pipe.save_pretrained('counterfeit-v3', safe_serialization=True)
          PY
          du -sh counterfeit-v3/* | tr '\n' ' '

      - name: Convert to Core ML + 6-bit palettization
        run: |
          mkdir -p out
          set +e
          python3 -m python_coreml_stable_diffusion.torch2coreml \
            --model-version "$PWD/counterfeit-v3" \
            --convert-text-encoder --convert-unet --convert-vae-decoder --convert-safety-checker \
            --attention-implementation SPLIT_EINSUM_V2 \
            --quantize-nbits 6 \
            -o out > convert.log 2>&1
          rc=$?
          set -e
          tail -60 convert.log
          if [ $rc -ne 0 ]; then
            echo "::error title=torch2coreml rc=$rc::$(grep -v '^\s*$' convert.log | tail -25 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $rc
          fi
          # torch2coreml 은 텍스트 인코더·Unet 만 줄이므로 안전 검사기는 같은 방식(6bit k-means 팔레트)으로 직접 줄인다
          python3 - <<'PY'
          import glob, coremltools as ct
          p = glob.glob('out/*_safety_checker.mlpackage')[0]
          m = ct.models.MLModel(p, compute_units=ct.ComputeUnit.CPU_ONLY)
          cfg = ct.optimize.coreml.OptimizationConfig(
              global_config=ct.optimize.coreml.OpPalettizerConfig(mode='kmeans', nbits=6),
              op_type_configs={'gather': None})
          ct.optimize.coreml.palettize_weights(m, config=cfg).save(p)
          PY
          ls -la out
          echo "::notice title=mlpackages::$(du -sh out/*.mlpackage | tr '\n' ' ')"

      - uses: actions/upload-artifact@v6
        with:
          name: mlpackages
          path: out/*.mlpackage
          retention-days: 3

  package:
    needs: convert
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: mlpackages
          path: pkgs

      - name: Compile for Neural Engine
        run: |
          mkdir -p res
          for kind in text_encoder:TextEncoder unet:Unet vae_decoder:VAEDecoder safety_checker:SafetyChecker; do
            src=$(ls -d pkgs/*_"${kind%%:*}".mlpackage | head -1)
            [ -n "$src" ] || { echo "::error::${kind%%:*} mlpackage 없음"; ls pkgs; exit 1; }
            xcrun coremlcompiler compile "$src" tmpc
            mv tmpc/*.mlmodelc "res/${kind##*:}.mlmodelc"
          done
          ls res

      - name: Add tokenizer
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern sd15-palettized-split-einsum-v2.zip --pattern sd.json
          unzip -q sd15-palettized-split-einsum-v2.zip '*vocab.json' '*merges.txt' -d apple
          cp "$(find apple -name vocab.json -not -path '*/__MACOSX/*' | head -1)" res/
          cp "$(find apple -name merges.txt -not -path '*/__MACOSX/*' | head -1)" res/
          UNET=$(du -sm res/Unet.mlmodelc | cut -f1)
          echo "::notice title=resources::$(du -sh res/* | tr '\n' ' ')"
          [ "$UNET" -gt 400 ] || { echo "::error::Unet ${UNET}MB 너무 작음"; exit 1; }

      - name: Zip, manifest, upload
        run: |
          mv res counterfeit-v3-6bit
          zip -q -r -0 "$ASSET" counterfeit-v3-6bit
          SIZE=$(stat -f %z "$ASSET"); SHA=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)
          OLD_ID=$(python3 -c "import json;print(json.load(open('sd.json')).get('id','sd15'))")
          cp sd.json "sd-$OLD_ID.json"
          mkdir dist && split -b 1900m "$ASSET" "dist/$ASSET.part" && rm "$ASSET"
          python3 - <<PY
          import json, os, glob
          parts = [{"name": os.path.basename(p), "size": os.path.getsize(p)} for p in sorted(glob.glob("dist/$ASSET.part*"))]
          assert sum(p["size"] for p in parts) == $SIZE
          json.dump({"format": 2, "id": "$MODEL_ID", "name": "$ASSET", "size": $SIZE, "sha256": "$SHA", "parts": parts,
                     "model": "$MODEL_DESC", "license": "CreativeML OpenRAIL-M"}, open("dist/sd.json", "w"), indent=2)
          PY
          cat > dist/NOTICE-SD.txt <<'TXT'
          Counterfeit-V3.0 (gsdf) was converted to Core ML. The UNet, text encoder and safety checker were palettized to six bits.
          VAE remains in full precision. The model and derivatives remain subject to CreativeML OpenRAIL-M and its use restrictions.
          Source: https://huggingface.co/gsdf/Counterfeit-V3.0
          TXT
          python3 tools/package_model_licenses.py drawing dist
          cp "sd-$OLD_ID.json" dist/
          echo "::notice title=sd.json::$(tr -d '\n' < dist/sd.json)"
          gh release upload "$TAG" dist/"$ASSET".part* dist/sd-*.json dist/CreativeML-OpenRAIL-M.txt dist/NOTICE-SD.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/sd.json --clobber --repo "$GITHUB_REPOSITORY"
