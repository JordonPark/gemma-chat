plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ocr'
version = '1.0.0'

android {
  namespace "expo.modules.ocr"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  // 물체 인식 모델은 iOS 와 같은 파일을 쓴다 (modules/expo-ocr/ios/models)
  sourceSets {
    main {
      assets.srcDirs += ['../ios/models']
    }
  }
}

dependencies {
  // ML Kit 한국어 인식 모델을 앱에 포함 (Google Play 서비스·인터넷 없이 동작). 한글과 영문을 함께 읽는다.
  implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
  // 실시간 글자 스캔: 카메라 미리보기를 바로 읽는다 (사진을 찍지 않아 셔터 소리 없음)
  def camerax = '1.4.2'
  implementation "androidx.camera:camera-camera2:${camerax}"
  implementation "androidx.camera:camera-lifecycle:${camerax}"
  implementation "androidx.camera:camera-view:${camerax}"
  // 사진 속 물건 위치 찾기 (MediaPipe 물체 인식, 기기 안에서만)
  implementation 'com.google.mediapipe:tasks-vision:0.10.+'
}
